[project]
name = "so101-food"
version = "0.1.0"
description = "SO-101 アームで食材小片を鍋に投入するタスクを、シミュレーションで自動生成したデータから模倣学習する"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "so101-nexus==0.10.0",
    "lerobot[dataset,training]==0.6.1",
    "mujoco>=3.1.3,<4",
    "numpy<3",
    "trimesh<5",
    "imageio[ffmpeg]",
]

[project.optional-dependencies]
notebook = ["ipykernel", "matplotlib"]
dev = ["pytest", "ruff", "nbclient", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_food"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["so101_food"]

[tool.pytest.ini_options]
testpaths = ["tests"]
